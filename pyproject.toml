[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesnet_tool"
version = "0.1.0"
description = "Bayesian network analysis tool with Streamlit UI"
authors = [
    {name = "Andrea Spinelli"}
]

requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "networkx",
    "streamlit",
    "pgmpy",
    "pyro_ppl"
]
